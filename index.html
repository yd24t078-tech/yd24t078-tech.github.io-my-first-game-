<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>미니 텍스트 RPG</title><style>body{font-family:'Malgun Gothic',sans-serif;background-color:#1e1e1e;color:#fff;text-align:center;padding:20px}.game-box{background-color:#2d2d2d;max-width:500px;margin:0 auto;padding:20px;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,.5)}.status{background-color:#3d3d3d;padding:10px;border-radius:5px;margin-bottom:20px;text-align:left;font-size:15px}.log-box{background-color:#111;height:150px;overflow-y:auto;padding:10px;border-radius:5px;text-align:left;font-size:14px;color:#00ff00;margin-bottom:20px}.btn-group button{padding:12px 24px;margin:5px;font-size:16px;font-weight:bold;background-color:#444;color:#fff;border:2px solid #555;border-radius:5px;cursor:pointer}.btn-group button:hover{background-color:#555}.btn-adventure{border-color:#ff4757!important;color:#ff4757!important}.btn-shop{border-color:#ffa502!important;color:#ffa502!important}.btn-rest{border-color:#2ed573!important;color:#2ed573!important}</style></head><body><div class="game-box"><h2>⚔️ 미니 텍스트 RPG 🛡️</h2><div class="status">💪 레벨: <span id="lvl">1</span> | 🩸 체력: <span id="hp">100</span>/100<br>⚔️ 공격력: <span id="atk">10</span> (+<span id="weaponAtk">0</span>)<br>💰 골드: <span id="gold">0</span> G</div><div class="log-box" id="log">[시스템] 게임이 시작되었습니다. 모험을 떠나보세요!</div><div class="btn-group"><button class="btn-adventure" onclick="adventure()">🤠 모험하기</button><button class="btn-shop" onclick="buyWeapon()">🛒 무기 강화 (50G)</button><button class="btn-rest" onclick="rest()">💤 여관에서 휴식 (10G)</button></div></div><script>let player={lvl:1,hp:100,maxHp:100,atk:10,weaponAtk:0,gold:0};const monsters=[{name:"슬라임",hp:20,atk:3,gold:15,exp:20},{name:"고블린",hp:45,atk:7,gold:30,exp:40},{name:"오크",hp:80,atk:15,gold:60,exp:80},{name:"🔥최종보스 드래곤🔥",hp:250,atk:30,gold:999,exp:999}];const logBox=document.getElementById("log");function printLog(e){logBox.innerHTML+="<br>"+e;logBox.scrollTop=logBox.scrollHeight}function updateStatus(){document.getElementById("lvl").innerText=player.lvl;document.getElementById("hp").innerText=player.hp;document.getElementById("atk").innerText=player.atk;document.getElementById("weaponAtk").innerText=player.weaponAtk;document.getElementById("gold").innerText=player.gold}function adventure(){if(player.hp<=0)return void printLog("[경고] 체력이 없습니다! 여관에서 휴식하세요.");let e=Math.floor(3*Math.random());player.lvl>=4&&Math.random()>.6&&(e=3);let t={...monsters[e]};printLog(`⚔️ <b>${t.name}</b>을(를) 마주쳤습니다! (몬스터 체력: ${t.hp})`);let n=player.atk+player.weaponAtk;t.hp-=n,printLog(`💥 당신이 ${n}의 데미지를 입혔습니다.`),t.hp>0&&(player.hp-=t.atk,printLog(`🩸 ${t.name}에게 ${t.atk}의 데미지를 입었습니다.`)),t.hp<=0&&(player.gold+=t.gold,printLog(`🏆 승리! ${t.gold}G를 획득했습니다.`),3===e&&printLog("🎉🎉🎉 축하합니다! 최종 보스 드래곤을 물리치고 세상을 구했습니다! 🎉🎉🎉"),Math.random()>.6&&(player.lvl++,player.maxHp+=20,player.hp=player.maxHp,player.atk+=5,printLog(`✨ 레벨업! Level ${player.lvl}이 되었습니다! 체력이 모두 회복됩니다.`))),player.hp<=0&&(player.hp=0,printLog("💀 주님 곁으로 갔습니다... 여관에서 부활하세요.")),updateStatus()}function buyWeapon(){player.gold>=50?(player.gold-=50,player.weaponAtk+=5,printLog("⚔️ 무기를 강화했습니다! 공격력이 5 증가합니다.")):printLog("❌ 골드가 부족합니다! (필요: 50G)"),updateStatus()}function rest(){player.gold>=10?(player.gold-=10,player.hp=player.maxHp,printLog("💤 여관에서 푹 쉬었습니다. 체력이 모두 회복됩니다!")):0===player.hp&&player.gold<10?(player.hp=20,printLog("❤️ 마을 주민들이 당신을 가엾게 여겨 체력을 20만큼 치료해줬습니다.")):printLog("❌ 골드가 부족합니다! (필요: 10G)"),updateStatus()}</script></body></html>
