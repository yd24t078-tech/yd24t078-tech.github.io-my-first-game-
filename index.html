<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 미니 2D 마크</title>
    <style>
        /* 모바일 화면 맞춤 및 스크롤 방지 */
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #74b9ff; /* 하늘색 배경 */
            font-family: 'Malgun Gothic', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            height: 100vh; width: 100vw;
        }
        #ui-top {
            width: 100%; max-width: 500px; padding: 10px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.4); color: white; font-weight: bold; font-size: 14px;
        }
        canvas {
            background-color: #74b9ff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: block;
        }
        /* 하단 모바일 전용 터치 패널 */
        #control-panel {
            width: 100%; max-width: 500px; padding: 15px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            background: #2d3436; position: fixed; bottom: 0;
        }
        button {
            padding: 18px; font-size: 16px; font-weight: bold; color: white;
            border: none; border-radius: 8px; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-mode { background-color: #0984e3; }
        .btn-mode.break { background-color: #d63031; }
        .btn-block { background-color: #2ed573; }
    </style>
</head>
<body>

<div id="ui-top">
    <div>⛏️ 모바일 2D 크래프트</div>
    <div id="status-mode">모드: 🧱 블록 설치</div>
    <div id="status-block">선택: 🌱 잔디 블록</div>
</div>

<!-- 게임 화면 영역 -->
<canvas id="craftCanvas"></canvas>

<!-- 모바일 전용 조작 버튼 -->
<div id="control-panel">
    <button id="btnMode" class="btn-mode" onclick="toggleMode()">🛠️ 모드 변경</button>
    <button id="btnBlock" class="btn-block" onclick="changeBlockType()">📦 블록 종류</button>
</div>

<script>
    const canvas = document.getElementById("craftCanvas");
    const ctx = canvas.getContext("2d");

    // 모바일 해상도 유연 대응 설정
    const blockSize = 40; // 블록 1칸 크기 (40x40 픽셀)
    let gridCols, gridRows;

    let isBreakMode = false; // false = 설치, true = 부수기
    let currentBlockType = 1; // 1: 잔디, 2: 돌, 3: 나무, 4: 벽돌
    let worldMap = {}; // 블록 저장 공간 (Key: "x,y")

    const blockColors = {
        1: "#2ed573", // 잔디 (초록)
        2: "#747d8c", // 돌 (회색)
        3: "#ffa502", // 나무 (황토)
        4: "#ff4757"  // 벽돌 (빨강)
    };

    const blockNames = {
        1: "🌱 잔디 블록",
        2: "🪨 돌 블록",
        3: "🪵 나무 블록",
        4: "🧱 벽돌 블록"
    };

    // 화면 꽉 차게 캔버스 초기화 함수
    function resizeCanvas() {
        canvas.width = Math.min(window.innerWidth, 500);
        canvas.height = window.innerHeight - document.getElementById("ui-top").offsetHeight - document.getElementById("control-panel").offsetHeight;
        
        gridCols = Math.ceil(canvas.width / blockSize);
        gridRows = Math.ceil(canvas.height / blockSize);
        
        drawWorld();
    }

    // 기본 지형(바닥 레이어) 생성
    function generateInitialTerrain() {
        // 맨 밑에서 3개 줄은 기본 돌과 흙으로 깔아둠
        for (let col = 0; col < 15; col++) {
            worldMap[`${col},${8}`] = 1; // 잔디 바닥
            worldMap[`${col},${9}`] = 2; // 돌 바닥
            worldMap[`${col},${10}`] = 2;
        }
    }

    // 맵 그리기 로직 (오류 예방 핵심)
    function drawWorld() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 모바일 눈 피로 방지 격자 가이드선 그리기
        ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
        ctx.lineWidth = 1;
        for (let c = 0; c <= gridCols; c++) {
            ctx.beginPath(); ctx.moveTo(c * blockSize, 0); ctx.lineTo(c * blockSize, canvas.height); ctx.stroke();
        }
        for (let r = 0; r <= gridRows; r++) {
            ctx.beginPath(); ctx.moveTo(0, r * blockSize); ctx.lineTo(canvas.width, r * blockSize); ctx.stroke();
        }

        // 2. 저장된 블록 맵 정보 렌더링
        for (let key in worldMap) {
            const [c, r] = key.split(",").map(Number);
            const type = worldMap[key];
            
            if (type && blockColors[type]) {
                // 블록 바디 그리기
                ctx.fillStyle = blockColors[type];
                ctx.fillRect(c * blockSize, r * blockSize, blockSize, blockSize);
                
                // 마인크래프트 특유의 블록 테두리 선 구현
                ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";
                ctx.lineWidth = 2;
                ctx.strokeRect(c * blockSize, r * blockSize, blockSize, blockSize);
            }
        }
    }

    // 터치 입력 좌표 판정 및 액션 작동
    function handleTouch(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const touchX = clientX - rect.left;
        const touchY = clientY - rect.top;

        // 터치 좌표를 격자 인덱스(몇 번째 칸인지)로 정밀 변환
        const col = Math.floor(touchX / blockSize);
        const row = Math.floor(touchY / blockSize);
        const key = `${col},${row}`;

        if (isBreakMode) {
            // 부수기 모드
            delete worldMap[key];
        } else {
            // 설치 모드
            worldMap[key] = currentBlockType;
        }

        drawWorld();
    }

    // 터치/클릭 이벤트 바인딩 (모바일 하이브리드)
    canvas.addEventListener("touchstart", function(e) {
        e.preventDefault();
        if(e.touches.length > 0) {
            handleTouch(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: false });

    canvas.addEventListener("mousedown", function(e) {
        handleTouch(e.clientX, e.clientY);
    });

    // 상단 UI 및 모드 스위칭 시스템
    function toggleMode() {
        const btn = document.getElementById("btnMode");
        const status = document.getElementById("status-mode");
        isBreakMode = !isBreakMode;

        if (isBreakMode) {
            btn.innerText = "💥 파괴 모드";
            btn.className = "btn-mode break";
            status.innerText = "모드: ❌ 블록 파괴";
        } else {
            btn.innerText = "🛠️ 설치 모드";
            btn.className = "btn-mode";
            status.innerText = "모드: 🧱 블록 설치";
        }
    }

    // 설치할 블록 종류 교체 스위칭
    function changeBlockType() {
        currentBlockType = (currentBlockType % 4) + 1;
        document.getElementById("status-block").innerText = `선택: ${blockNames[currentBlockType]}`;
    }

    // 실행 시작 제어
    window.onload = function() {
        generateInitialTerrain();
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
    };
</script>

</body>
</html>
