<!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>2D 미니 액션 RPG</title> <style> body { margin: 0; background-color: #111; color: white; font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; } #gameUi { margin-bottom: 10px; font-size: 18px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 20px; } canvas { background-color: #222; border: 4px solid #444; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); max-width: 100%; } .instructions { margin-top: 15px; color: #aaa; font-size: 14px; text-align: center; } </style> </head> <body> <div id="gameUi"> ⚔️ 레벨: <span id="lvl">1</span> | 🩸 체력: <span id="hp">100</span>/100 | 💰 점수: <span id="score">0</span> </div> <canvas id="gameCanvas" width="600" height="400"></canvas> <div class="instructions"> 🕹️ <b>조작법:</b> 화면(캔버스) 안을 마우스로 클릭하거나 터치하면 <b>그 방향으로 캐릭터가 이동하며 검을 휘두릅니다!</b><br> 몬스터를 격파하고 레벨을 올려보세요! </div> <script> const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d"); // 플레이어 설정 let player = { x: 300, y: 200, radius: 15, speed: 4, hp: 100, maxHp: 100, lvl: 1, score: 0, targetX: 300, targetY: 200, isAttacking: false, attackTimer: 0 }; // 몬스터 목록 let enemies = []; let lastSpawn = 0; let spawnInterval = 1500; // 1.5초마다 몬스터 생성 // 터치/클릭으로 이동 및 공격 타겟 지정 function setTarget(e) { const rect = canvas.getBoundingClientRect(); // 터치 이벤트와 마우스 이벤트 분기 처리 const clientX = e.touches ? e.touches[0].clientX : e.clientX; const clientY = e.touches ? e.touches[0].clientY : e.clientY; player.targetX = clientX - rect.left; player.targetY = clientY - rect.top; // 이동할 때 공격 모션 발동 player.isAttacking = true; player.attackTimer = 10; } canvas.addEventListener("mousedown", setTarget); canvas.addEventListener("touchstart", function(e) { e.preventDefault(); // 태블릿 스크롤 방지 setTarget(e); }, { passive: false }); // UI 업데이트 function updateUi() { document.getElementById("lvl").innerText = player.lvl; document.getElementById("hp").innerText = player.hp; document.getElementById("score").innerText = player.score; }// 몬스터 생성 function spawnEnemy() { let x, y; // 화면 외곽에서 생성 if (Math.random() < 0.5) { x = Math.random() < 0.5 ? -20 : canvas.width + 20; y = Math.random() * canvas.height; } else { x = Math.random() * canvas.width; y = Math.random() < 0.5 ? -20 : canvas.height + 20; } enemies.push({ x: x, y: y, radius: 12, speed: 1 + (player.lvl * 0.2), // 레벨이 오를수록 빨라짐 color: `hsl(${Math.random() * 360}, 70%, 50%)` }); } // 게임 루프 function gameLoop(timestamp) { // 1. 배경 청소 및 바닥 격자 그리기 ctx.fillStyle = "#2c3e50"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = "#34495e"; ctx.lineWidth = 1; for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); } for(let j=0; j<canvas.height; j+=40) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); ctx.stroke(); } if (player.hp > 0) { // 2. 플레이어 이동 로직 let dx = player.targetX - player.x; let dy = player.targetY - player.y; let dist = Math.sqrt(dx * dx + dy * dy); if (dist > 5) { player.x += (dx / dist) * player.speed; player.y += (dy / dist) * player.speed; } // 3. 몬스터 생성 관리 if (timestamp - lastSpawn > spawnInterval) { spawnEnemy(); lastSpawn = timestamp; } // 4. 플레이어 그리기 (영웅 바디) ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fillStyle = "#3498db"; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); // 공격 애니메이션 (검 휘두르기 효과) if (player.isAttacking && player.attackTimer > 0) { ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 20, 0, Math.PI * 2); ctx.strokeStyle = "rgba(255, 234, 0, 0.6)"; ctx.lineWidth = 6; ctx.stroke(); player.attackTimer--; if (player.attackTimer <= 0) player.isAttacking = false; } // 5. 몬스터 로직 처리 for (let i = enemies.length - 1; i >= 0; i--) { let e = enemies[i]; // 플레이어를 향해 추적 이동 let edx = player.x - e.x; let edy = player.y - e.y; let edist = Math.sqrt(edx * edx + edy * edy); e.x += (edx / edist) * e.speed; e.y += (edy / edist) * e.speed; // 몬스터 그리기 ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fillStyle = e.color; ctx.fill(); // 충돌 검사 (공격 범위 내에 있는지) if (player.isAttacking && edist < player.radius + 25) { // 사냥 성공 enemies.splice(i, 1); player.score += 10; if (player.score % 50 === 0) { player.lvl++; player.speed += 0.5; } continue; } // 플레이어 피격 검사 if (edist < player.radius + e.radius) { player.hp -= 1; // 초당 다단히트 데미지 if (player.hp <= 0) player.hp = 0; } } updateUi(); } else { // 게임 오버 화면 ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "red"; ctx.font = "bold 40px Malgun Gothic"; ctx.fillText("GAME OVER", canvas.width/2 - 120, canvas.height/2); ctx.fillStyle = "white"; ctx.font = "20px Malgun Gothic"; ctx.fillText("새로고침(F5)을 하여 다시 도전하세요!", canvas.width/2 - 160, canvas.height/2 + 50); } requestAnimationFrame(gameLoop); } // 게임 시작 requestAnimationFrame(gameLoop); </script> </body> </html>
